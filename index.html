<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111216"><meta name="description" content="Выдержка, диафрагма и ISO — попробуй настройки камеры."><title>Кадр</title><link rel="stylesheet" href="style.css?v=mobile1"></head>
<body><main class="app">
<header><h1>Кадр<span>Настройки камеры</span></h1><button id="reset" aria-label="Сбросить настройки" title="Сбросить настройки">↺</button></header>
<section class="picture" aria-label="Изображение камеры"><canvas id="scene" width="640" height="360" role="img" aria-label="Движущийся мяч перед дальним фоном. Настройки меняют смаз движения, размытие фона, шум и яркость."></canvas><button id="motion" aria-label="Пауза движения" aria-pressed="false">Ⅱ</button><div id="loading">Загрузка…</div></section>
<p id="hint" class="hint" aria-live="polite">Меняй настройки и смотри на картинку.</p>
<section class="controls" aria-label="Настройки">
<div class="control"><div class="heading"><label for="shutter">Выдержка</label><output id="shutterValue" for="shutter">1/50 с</output></div><input id="shutter" type="range" min="0" max="9" value="3" step="1"><div class="ends"><span>Больше смаза</span><span>Чётче движение</span></div></div>
<div class="control"><div class="heading"><label for="aperture">Диафрагма</label><output id="apertureValue" for="aperture">f/4</output></div><input id="aperture" type="range" min="0" max="7" value="3" step="1"><div class="ends"><span>Фон мягче</span><span>Фон чётче</span></div></div>
<div class="control"><div class="heading"><label for="iso">ISO</label><output id="isoValue" for="iso">400</output></div><input id="iso" type="range" min="0" max="10" value="2" step="1"><div class="ends"><span>Меньше шума</span><span>Больше шума</span></div></div>
</section>
<button class="brightness" id="brightness" aria-pressed="true"><span class="switch" aria-hidden="true"></span><span id="brightnessText">Яркость выровнена</span></button>
</main><script type="module" src="app.js?v=shutter3"></script></body></html>
